name: ClamAV Static File Scan

# Scans files with the real ClamAV engine. Files are NEVER executed — only read
# and matched against virus signatures.
#
# This workflow is used twice:
#  1. In this repo, for manual/test scans of quarantine/.
#  2. In the PRIVATE quarantine repo (npm run setup:quarantine), where the web
#     app commits uploads to quarantine/incoming/. After scanning, the verdict is
#     written to scan-results/<sha256>.json and the payload is deleted.
#
# GitHub caps a single job at 6 hours; we keep this bounded on purpose.

on:
  push:
    paths:
      - 'quarantine/**'
      - '.github/workflows/clamav-scan.yml'
  workflow_dispatch:
    inputs:
      file_url:
        description: 'Optional http(s) URL of a file to download and scan (never executed)'
        required: false
        default: ''
      reason:
        description: 'Why this scan was triggered (ticket / reference)'
        required: false
        default: 'manual'
  schedule:
    - cron: '0 3 * * *' # daily at 03:00 UTC

permissions:
  contents: write # needed to publish results and delete scanned payloads

concurrency:
  group: clamav-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install ClamAV
        timeout-minutes: 15
        run: |
          sudo apt-get update
          sudo apt-get install -y clamav

      - name: Update virus definitions
        timeout-minutes: 15
        run: |
          sudo systemctl stop clamav-freshclam 2>/dev/null || true
          sudo freshclam || echo "::warning::freshclam failed — falling back to bundled signatures"

      - name: Fetch remote file (optional)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.file_url != '' }}
        env:
          # Passed through env so the user-supplied URL is never interpolated
          # into the shell script (command-injection safe).
          FILE_URL: ${{ github.event.inputs.file_url }}
        run: |
          mkdir -p /tmp/clamav-in
          curl -fsSL --max-time 600 --max-filesize 1073741824 \
            -o /tmp/clamav-in/downloaded.bin \
            "$FILE_URL"
          sha=$(sha256sum /tmp/clamav-in/downloaded.bin | cut -d' ' -f1)
          # Use the URL basename (query string stripped, unsafe chars replaced).
          name="${FILE_URL%%\?*}"
          name=$(basename "$name")
          name=$(printf '%s' "$name" | tr -c 'A-Za-z0-9._-' '_')
          [ -n "$name" ] || name="downloaded.bin"
          mkdir -p quarantine/incoming
          mv /tmp/clamav-in/downloaded.bin "quarantine/incoming/${sha}-${name}"
          ls -lh quarantine/incoming

      - name: Scan with ClamAV (static only)
        id: scan
        run: |
          set +e
          clamscan --infected --recursive --log=clamav-report.log quarantine/
          code=$?
          set -e
          infected=$(grep -c "FOUND" clamav-report.log 2>/dev/null || true)
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "infected=$infected" >> "$GITHUB_OUTPUT"
          echo "--- Scan summary ---"
          grep -E "Scanned files|Infected files" clamav-report.log 2>/dev/null || true
          exit 0

      - name: Publish results and delete scanned payloads
        if: always()
        run: |
          [ -f clamav-report.log ] || exit 0
          shopt -s nullglob
          for f in quarantine/incoming/*; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            sha="${base%%-*}"
            filename="${base#*-}"
            if ! printf '%s' "$sha" | grep -Eq '^[a-f0-9]{64}$'; then
              sha=$(sha256sum "$f" | cut -d' ' -f1)
            fi

            sigs_json=""
            if grep -q "$sha" clamav-report.log; then
              while IFS= read -r sig; do
                [ -n "$sig" ] && sigs_json="${sigs_json}\"${sig}\","
              done < <(grep "$sha" clamav-report.log | sed -E 's/^.*: (.*) FOUND$/\1/')
              infected=true
              verdict=malicious
            else
              infected=false
              verdict=clean
            fi
            sigs_json="[${sigs_json%,}]"

            mkdir -p scan-results
            cat > "scan-results/${sha}.json" <<JSON
          {
            "sha256": "${sha}",
            "filename": "${filename}",
            "infected": ${infected},
            "verdict": "${verdict}",
            "signatures": ${sigs_json},
            "scannedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "engine": "ClamAV"
          }
          JSON
            rm -f "$f"
          done

      - name: Build scan-results data listing
        if: always()
        run: |
          set -euo pipefail
          mkdir -p scan-results
          shopt -s nullglob

          files=()
          for f in scan-results/*.json; do
            if [ "$(basename "$f")" = "index.json" ]; then
              continue
            fi
            files+=("$f")
          done

          if [ ${#files[@]} -eq 0 ]; then
            if [ ! -f scan-results/index.json ]; then
              jq -n \
                --arg generated "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                --arg repo "$GITHUB_REPOSITORY" \
                '{generatedAt:$generated, repository:$repo, total:0, clean:0, malicious:0, results:[]}' \
                > scan-results/index.json
              printf '# ClamAV scan results\n\nNo scans yet. Upload a file or run the workflow.\n' \
                > scan-results/README.md
            fi
            echo "No result files yet."
            exit 0
          fi

          # Avoid a daily no-op commit: only rebuild when a result is newer than
          # the existing index (or the index is missing).
          if [ -f scan-results/index.json ] && \
             ! find scan-results -maxdepth 1 -name '*.json' ! -name 'index.json' \
                 -newer scan-results/index.json | grep -q .; then
            echo "Data listing is already up to date."
            exit 0
          fi

          jq -s \
            --arg generated "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg repo "$GITHUB_REPOSITORY" \
            '
              map(select(type == "object" and .sha256 != null))
              | sort_by(.scannedAt // "") | reverse
              | {
                  generatedAt: $generated,
                  repository: $repo,
                  total: length,
                  clean: (map(select(.verdict == "clean")) | length),
                  malicious: (map(select(.verdict == "malicious")) | length),
                  results: map({
                    sha256, filename, infected, verdict, signatures, scannedAt, engine,
                    resultPath: ("scan-results/" + .sha256 + ".json")
                  })
                }
            ' "${files[@]}" > scan-results/index.json

          {
            echo "# ClamAV scan results"
            echo ""
            echo "Generated by the [ClamAV scan workflow]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/clamav-scan.yml)."
            echo ""
            echo "| Scanned (UTC) | Verdict | File | SHA-256 | Signatures |"
            echo "| --- | --- | --- | --- | --- |"
            jq -r '.results[] | "| \(.scannedAt // "-") | \(.verdict) | \(.filename // "-") | `\(.sha256)` | \(if ((.signatures // []) | length) > 0 then (.signatures | join(", ")) else "-" end) |"' \
              scan-results/index.json
          } > scan-results/README.md

          echo "Data listing updated: $(jq -r '.total' scan-results/index.json) result(s)."

      - name: Commit results and data listing
        if: always()
        run: |
          [ -d scan-results ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A scan-results
          if [ -d quarantine ]; then
            git add -A quarantine
          fi
          if ! git diff --cached --quiet; then
            git commit -m "ClamAV results and data listing ${GITHUB_SHA}"
            # A new upload (or workflow update) can land while ClamAV scans, so
            # the first push may be rejected. Rebase and retry a couple of times.
            for attempt in 1 2 3; do
              if git push; then
                echo "Published results and data listing."
                break
              fi
              if [ "$attempt" = "3" ]; then
                echo "::error::Could not publish results after 3 attempts."
                exit 1
              fi
              git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}"
              sleep 2
            done
          else
            echo "No results to publish."
          fi

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## 🦠 ClamAV static scan"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Trigger | \`${{ github.event_name }}\` |"
            echo "| Infected files | **${{ steps.scan.outputs.infected }}** |"
            echo "| Exit code | \`${{ steps.scan.outputs.exit_code }}\` |"
            echo ""
            echo '```'
            tail -n 40 clamav-report.log 2>/dev/null || echo "no report produced"
            echo '```'
            if [ -f scan-results/index.json ]; then
              echo ""
              echo "### 📋 Data listing"
              echo ""
              echo "| Verdict | File | SHA-256 |"
              echo "| --- | --- | --- |"
              jq -r '.results[:10][] | "| \(.verdict) | \(.filename // "-") | `\(.sha256)` |"' scan-results/index.json
              echo ""
              echo "Full listing: \`scan-results/index.json\` (served by \`GET /api/scan-results\`)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clamav-report
          path: clamav-report.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Fail on detection or scan error
        if: steps.scan.outputs.exit_code != '0'
        run: |
          echo "::error::ClamAV reported malware or a scan error (exit ${{ steps.scan.outputs.exit_code }}). See the clamav-report artifact."
          exit 1
