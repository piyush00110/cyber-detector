name: ClamAV Static File Scan

# Scans files with the real ClamAV engine. Files are NEVER executed — only read
# and matched against virus signatures.
#
# This workflow is used twice:
#  1. In this repo, for manual/test scans of quarantine/.
#  2. In the PRIVATE quarantine repo (npm run setup:quarantine), where the web
#     app commits uploads to quarantine/incoming/. After scanning, the verdict is
#     written to scan-results/<sha256>.json and the payload is deleted.
#
# GitHub caps a single job at 6 hours; we keep this bounded on purpose.

on:
  push:
    paths:
      - 'quarantine/**'
      - '.github/workflows/clamav-scan.yml'
  workflow_dispatch:
    inputs:
      file_url:
        description: 'Optional http(s) URL of a file to download and scan (never executed)'
        required: false
        default: ''
      reason:
        description: 'Why this scan was triggered (ticket / reference)'
        required: false
        default: 'manual'
  schedule:
    - cron: '0 3 * * *' # daily at 03:00 UTC

permissions:
  contents: write # needed to publish results and delete scanned payloads

concurrency:
  group: clamav-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install ClamAV
        timeout-minutes: 15
        run: |
          sudo apt-get update
          sudo apt-get install -y clamav

      - name: Update virus definitions
        timeout-minutes: 15
        run: |
          sudo systemctl stop clamav-freshclam 2>/dev/null || true
          sudo freshclam || echo "::warning::freshclam failed — falling back to bundled signatures"

      - name: Fetch remote file (optional)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.file_url != '' }}
        run: |
          mkdir -p /tmp/clamav-in
          curl -fsSL --max-time 600 --max-filesize 1073741824 \
            -o /tmp/clamav-in/downloaded.bin \
            "${{ github.event.inputs.file_url }}"
          sha=$(sha256sum /tmp/clamav-in/downloaded.bin | cut -d' ' -f1)
          mkdir -p quarantine/incoming
          mv /tmp/clamav-in/downloaded.bin "quarantine/incoming/${sha}-downloaded.bin"
          ls -lh quarantine/incoming

      - name: Scan with ClamAV (static only)
        id: scan
        run: |
          set +e
          clamscan --infected --recursive --log=clamav-report.log quarantine/
          code=$?
          set -e
          infected=$(grep -c "FOUND" clamav-report.log 2>/dev/null || true)
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "infected=$infected" >> "$GITHUB_OUTPUT"
          echo "--- Scan summary ---"
          grep -E "Scanned files|Infected files" clamav-report.log 2>/dev/null || true
          exit 0

      - name: Publish results and delete scanned payloads
        if: always()
        run: |
          [ -f clamav-report.log ] || exit 0
          shopt -s nullglob
          for f in quarantine/incoming/*; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            sha="${base%%-*}"
            if ! printf '%s' "$sha" | grep -Eq '^[a-f0-9]{64}$'; then
              sha=$(sha256sum "$f" | cut -d' ' -f1)
            fi

            sigs_json=""
            if grep -q "$sha" clamav-report.log; then
              while IFS= read -r sig; do
                [ -n "$sig" ] && sigs_json="${sigs_json}\"${sig}\","
              done < <(grep "$sha" clamav-report.log | sed -E 's/^.*: (.*) FOUND$/\1/')
              infected=true
              verdict=malicious
            else
              infected=false
              verdict=clean
            fi
            sigs_json="[${sigs_json%,}]"

            mkdir -p scan-results
            cat > "scan-results/${sha}.json" <<JSON
          {
            "sha256": "${sha}",
            "filename": "${base}",
            "infected": ${infected},
            "verdict": "${verdict}",
            "signatures": ${sigs_json},
            "scannedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "engine": "ClamAV"
          }
          JSON
            rm -f "$f"
          done

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A scan-results quarantine
          if ! git diff --cached --quiet; then
            git commit -m "ClamAV results ${GITHUB_SHA}"
            git push
          else
            echo "No results to publish."
          fi

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## 🦠 ClamAV static scan"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Trigger | \`${{ github.event_name }}\` |"
            echo "| Infected files | **${{ steps.scan.outputs.infected }}** |"
            echo "| Exit code | \`${{ steps.scan.outputs.exit_code }}\` |"
            echo ""
            echo '```'
            tail -n 40 clamav-report.log 2>/dev/null || echo "no report produced"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clamav-report
          path: clamav-report.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Fail on detection or scan error
        if: steps.scan.outputs.exit_code != '0'
        run: |
          echo "::error::ClamAV reported malware or a scan error (exit ${{ steps.scan.outputs.exit_code }}). See the clamav-report artifact."
          exit 1
